paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  knowledge: knowledge
  outputs: outputs

acquisition:
  n_raw_frames: 72
  step_deg: 5.0
  frame_size: 490
  valid_radius_px: 232
  um_per_px_rot: 4.181
  polariser_deg: 0.0

calibration:
  max_specimens: 10
  request_delay_s: 0.5

align:
  orb_features: 3000
  n_matches: 600
  ransac_px: 2.0
  max_angle_err_deg: 1.5
  max_scale_err: 0.01

maps:
  aniso_min: 0.15
  high_order_white:
    dE: 25
    L: 75
    chroma: 15
    relief_mod: 0.3
  biref_class_nm: [100, 350, 1100, 2000]
  pleo_class_dE: [4, 10, 20]
  opaque_rel_L: 0.15
  xpl_dark_rel: 0.08          # never brighter than 8% of white in XPL -> isotropic/opaque

segment:
  slic_px_per_segment: 60
  slic_compactness: 5
  T_merge: 18
  merge_mode: hierarchical
  twin_merge:
    dE_ppl: 6
    max_biref_diff: 1
    boundary_grad_ratio: 0.5
    min_shared_px: 15
  min_region_px: 150
  min_sample_px: 400
  hole_rel_L: 0.92
  aggregate:
    circvar: 0.6
    r2_4: 0.4

features:
  border_exclude_px: 2
  min_aspect_for_axis: 1.3
  absorption_min_px: 20
  absorption_min_frac: 0.10
  twin:
    min_frac: 0.10
    min_sep_deg: 8
    min_r2_4: 0.5               # only pixels with a reliable extinction angle
    max_cluster_std_deg: 7.0    # each twin domain must be tight
    max_boundary_grad_ratio: 2.0  # sharper PPL boundary -> two grains, not a twin
  colour:
    min_chroma: 2.5             # OU images are weakly saturated
    light_L: 70.0
  cleavage:
    sato_sigmas: [1, 2]
    ridge_pct: 95
    hough_min_len: 12
    peak_frac: 0.20

rules:
  accept_p: 0.80
  accept_margin: 0.40
  group_p: 0.85
  min_r2_4: 0.4
  min_features: 4
  always_allowed: [opaque, fine_aggregate]
  p_unlisted: 0.25              # "none of the listed minerals fits" candidate
  undulose_high_quantile: 0.80  # threshold = this quantile of undulose_score
  twinkle_high_quantile: 0.90   # of relief_mod_med over non-pleochroic grains
  # undulose_high: 60           # optional fixed values instead of quantiles
  # twinkle_high: 0.27
  non_label_groups: [accessory, isotropic_other, sheet_other]

classes:
  min_regions: 30
  min_specimens: 3

dataset:
  crop_scale: 1.3
  crop_min_px: 48
  input_px: 224
  context_dim: 0.35
  folds: 5
  val_frac: 0.15
  seed: 0

model:
  encoder: dinov2_vits14
  n_versions: 1
  d_model: 256
  n_layers: 2
  n_heads: 4
  ffn: 512
  dropout: 0.1

train:
  lr: 5.0e-4
  weight_decay: 0.05
  epochs: 80
  warmup_epochs: 3
  patience: 15
  batch_labelled: 96
  bags_per_batch: 4
  bag_size: 16
  label_smoothing: 0.0
  logit_adjust_tau: 0.0
  lambda_group: 0.0
  lambda_prop: 0.0
  lambda_mil: 0.0
  mil_neg_beta: 0.2
  mono_weight: 1.5
  angle_dropout:
    p: 0.5
    K: [6, 9, 12, 18, 36]
  angle_jitter_deg: 1.0
  seeds: [0, 1, 2]

selftrain:
  p_min: 0.90
  pseudo_weight: 0.7
  rounds: 2

infer:
  min_angles: 6
  max_angle_gap_deg: 3
  uncertain_p: 0.6

v1:
  version: "v1.0"
  data_version: "v1"
  taxonomy:
    primary_classes: [quartz, feldspar, mica, pyroxene, opaque_material]
    candidate_registry: [quartz, feldspar, mica, pyroxene, opaque_material, amphibole, carbonate, tourmaline, olivine, garnet]
    class_extensions:
      amphibole: false
      carbonate: false
  rules:
    disabled_terms: [birefringence, extinction_type, relief, cleavage, absorption_axis]   # quarantined evidence
    status_default: unresolved        # missing status column => NOT observed
    require_status_columns: true      # error if features are legacy
    disable_mono: true                # no rock-title / monomineralic labels
    singleton_p: 0.80                 # family prob for a singleton target
    set_cum_p: 0.90                   # cumulative prob for a partial set
    max_set_size: 2
    max_out_of_scope_p: 0.20          # if out-of-scope mass >= this -> abstain
    min_informative_terms: 1          # at least one real optical cue
    list_conflict_policy: abstain     # abstain | keep_optics
    hard_contradiction_terms: [optic_class, pleochroism]
  families:                           # disjoint V1 taxonomy (species -> family)
    quartz: [quartz]
    feldspar: [plagioclase, orthoclase, microcline, sanidine]
    mica: [biotite, muscovite]
    pyroxene: [augite, orthopyroxene]
    opaque_material: [opaque]
  mixed_minerals: [fine_aggregate]    # never a mineral target -> state "mixed"
  paths:
    processed: data/processed/v1
    embeddings: outputs/v1/embeddings
    results: outputs/v1
  region_selection:
    min_area_px: 1000
    min_interior_px: 400
    erosion_px: 2
  training:
    mode: angle_aware_k12      # one of: static_k1, unordered_k12, angle_aware_k12
    min_train_specimens_per_class: 5
    primary_test_angle_index: 1
    k12_angle_indices: [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34]
    seeds: [0, 1, 2]
    n_bootstrap: 5000
    epochs: 80
    patience: 15
    lr: 5.0e-4
    weight_decay: 0.05
    batch_size: 32
    grad_clip: 1.0
